[workspace]
resolver = "2"
members = [
    "crates/firmforge-core",
    "crates/firmforge-flash",
    "crates/firmforge-app",
    "apps/desktop/src-tauri",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
license = "MIT"
repository = "https://github.com/apurv123/firmforge"
authors = ["apurv123"]

[workspace.dependencies]
firmforge-core = { path = "crates/firmforge-core" }
firmforge-flash = { path = "crates/firmforge-flash" }
firmforge-app = { path = "crates/firmforge-app" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
sha2 = "0.10"
hex = "0.4"
serialport = "4.9"
# Default features pull in espflash's whole CLI (clap, indicatif, update checks).
# `serialport` is the feature that exposes Flasher and Connection, which is all
# firmforge uses.
espflash = { version = "4.5", default-features = false, features = ["serialport"] }
url = "2"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"
